services:
  load_balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
    networks:
      - public_subnet
      - private_subnet

  backend_1:
    build: ./app
    environment:
      SERVER_ID: backend_1
    expose:
      - "5000"
    networks:
      - private_subnet

  backend_2:
    build: ./app
    environment:
      SERVER_ID: backend_2
    expose:
      - "5000"
    networks:
      - private_subnet

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
